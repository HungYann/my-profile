<style>
  .github-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }

  .github-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    background: rgba(30, 18, 8, 0.72);
    border: 1px solid rgba(232, 93, 47, 0.15);
    border-radius: 4px;
    text-decoration: none;
    color: var(--cream);
    overflow: hidden;
    transition: transform 0.3s ease, border-color 0.3s ease;
    backdrop-filter: blur(8px);
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

  .github-card:nth-child(1) { animation-delay: 1.1s; }
  .github-card:nth-child(2) { animation-delay: 1.25s; }

  .github-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      135deg,
      rgba(255, 179, 71, 0) 0%,
      rgba(192, 57, 43, 0.15) 100%
    );
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .github-card:hover::before {
    opacity: 1;
  }

  .github-card:hover {
    transform: translateY(-2px);
    border-color: rgba(232, 93, 47, 0.35);
  }

  .github-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255, 179, 71, 0.6);
    text-transform: uppercase;
  }

  .github-icon {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(232, 93, 47, 0.1);
    border-radius: 8px;
    opacity: 0.8;
  }

  .github-stats {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(253, 243, 227, 0.7);
  }

  .stat-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #f39c12;
  }

  .stat-number {
    font-weight: 600;
    color: rgba(255, 179, 71, 0.9);
  }

  @media (max-width: 600px) {
    .github-cards {
      grid-template-columns: 1fr;
    }
  }
</style>
